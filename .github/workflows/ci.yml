name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest tests/ -v --tb=short

      - name: Coverage
        if: matrix.python-version == '3.12'
        run: pytest tests/ --cov=agent_mcp_framework --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agent-mcp-framework:test .

      - name: Run container and health check
        run: |
          docker run -d --name amf-test -p 8080:8080 agent-mcp-framework:test
          sleep 5
          curl -f http://localhost:8080/health || exit 1
          docker stop amf-test
